<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 Hiring · Ksh700/24hrs · Ksh450/12hrs</title>
  <!-- Font Awesome for icons (optional, but used for phone/email) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
      color: #f0f3fa;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(20, 25, 35, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 3rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(100, 150, 255, 0.15);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
      color: #fff;
      text-shadow: 0 4px 12px rgba(0, 100, 255, 0.3);
    }

    .ps-badge {
      background: #003791;
      padding: 0.25rem 1rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: white;
      box-shadow: 0 0 20px rgba(0, 120, 255, 0.4);
    }

    .subhead {
      font-size: 1.2rem;
      color: #a0b8e0;
      margin-bottom: 2rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      font-weight: 300;
    }

    /* rates section */
    .rate-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .rate-card {
      flex: 1 1 220px;
      background: linear-gradient(135deg, #1e2533, #141a24);
      border-radius: 2rem;
      padding: 1.8rem 1.2rem;
      text-align: center;
      border: 1px solid rgba(0, 150, 255, 0.3);
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s ease;
    }

    .rate-card:hover {
      transform: translateY(-4px);
      border-color: #3b82f6;
    }

    .rate-title {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8bb4ff;
      font-weight: 400;
    }

    .rate-price {
      font-size: 3rem;
      font-weight: 800;
      margin: 0.25rem 0;
      color: #fff;
      line-height: 1.2;
    }

    .rate-price span {
      font-size: 1.2rem;
      font-weight: 400;
      color: #9bb9f0;
      margin-left: 4px;
    }

    .rate-duration {
      font-size: 1rem;
      color: #b0c8f0;
      border-top: 1px dashed #2e3b4e;
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }

    /* games section */
    .games-section {
      margin: 2rem 0 2.2rem;
    }

    .games-title {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d6e3ff;
    }

    .games-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1rem;
    }

    .game-chip {
      background: #1f2a3c;
      padding: 0.7rem 1.5rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 1.1rem;
      border: 1px solid #2f4160;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #eaf1ff;
      transition: 0.1s;
    }

    .game-chip i {
      color: #3b82f6;
      font-size: 1rem;
    }

    .game-chip:hover {
      background: #26344b;
      border-color: #4a7edb;
    }

    /* contact & whatsapp */
    .contact-block {
      background: #10161f;
      border-radius: 2rem;
      padding: 1.6rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-top: 2rem;
      border: 1px solid #1e2d42;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.2rem;
      background: #1a2332;
      padding: 0.6rem 1.6rem;
      border-radius: 3rem;
      transition: 0.15s;
      border: 1px solid #27374d;
    }

    .contact-item i {
      color: #3b82f6;
      font-size: 1.4rem;
      width: 24px;
      text-align: center;
    }

    .contact-item a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .contact-item a:hover {
      color: #7aa9ff;
    }

    .wa-highlight {
      background: #1f8b4c;
      border-color: #29a85f;
      box-shadow: 0 0 18px rgba(37, 211, 102, 0.3);
      transition: all 0.2s;
    }

    .wa-highlight i {
      color: white;
    }

    .wa-highlight a {
      color: white;
      font-weight: 600;
    }

    .wa-highlight:hover {
      background: #25a85a;
      border-color: #3ddc7a;
      transform: scale(1.02);
    }

    /* images (ps5 and gta6) */
    .image-showcase {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      margin: 2.5rem 0 1rem;
      justify-content: center;
    }

    .image-card {
      background: #121a26;
      border-radius: 2rem;
      padding: 1.2rem 1.2rem 0.8rem;
      flex: 1 1 240px;
      max-width: 300px;
      box-shadow: 0 12px 25px -8px black;
      border: 1px solid #2a3b55;
      text-align: center;
      transition: 0.15s;
    }

    .image-card:hover {
      border-color: #3b82f6;
    }

    .image-card svg {
      width: 100%;
      height: auto;
      border-radius: 1.2rem;
      background: #0d121c;
      display: block;
      margin-bottom: 0.75rem;
    }

    .image-label {
      font-size: 1rem;
      font-weight: 500;
      color: #aac2f0;
      letter-spacing: 0.5px;
      padding: 0.5rem 0;
    }

    /* footer / small note */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      text-align: center;
      color: #5b7297;
      border-top: 1px solid #1e2d42;
      padding-top: 1.2rem;
    }

    /* responsiveness */
    @media (max-width: 700px) {
      .container {
        padding: 1.8rem 1.2rem;
      }
      h1 {
        font-size: 1.9rem;
      }
      .rate-price {
        font-size: 2.4rem;
      }
      .contact-block {
        flex-direction: column;
        align-items: stretch;
      }
      .contact-item {
        justify-content: center;
      }
    }
  </style>
</head>
